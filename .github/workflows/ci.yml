name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the pinned environment
        run: python -m pip install -r requirements.txt ruff==0.16.6
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      # Without MONITOR_RUN the tests generate the corpus and train every fold first.
      - name: Test
        run: python -m pytest -q
